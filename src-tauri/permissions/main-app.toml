[[permission]]
identifier = "allow-main-app"
description = "Custom commands for the main window (settings, backup)."
commands.allow = [
  "database_health",
  "list_database_backups",
  "create_database_backup",
  "schedule_database_restore",
  "cancel_database_restore",
  "write_backup_file",
  "read_backup_file",
  "open_data_directory",
  "set_window_appearance",
  "restart_app",
]
