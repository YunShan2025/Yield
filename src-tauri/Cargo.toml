[package]
name = "youqiu"
version = "1.0.8"
description = "有秋 (Yield) — 本地优先的个人成长桌面应用"
authors = ["you"]
edition = "2021"

[lib]
name = "youqiu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 桌面专属插件：Android/iOS 构建排除，避免无实现目标编译失败。
# 注意 Cargo 不认识 tauri 注入的 cfg(desktop)，这里必须枚举排除目标。
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_UI_Shell",
] }

# Android：备份导入需经 ContentResolver 读取系统文件选择器返回的 content:// URI；
# 复用 wry 的主线程 JNI 调度（wry::prelude::dispatch），版本须与 tauri 所用 wry 对齐。
[target."cfg(target_os = \"android\")".dependencies]
jni = "0.21"
wry = { version = "0.55", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
