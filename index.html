<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>有秋 · Yield</title>
    <style>
      /* 启动卡：纯静态内联，窗口首次绘制即呈现，数据就绪后由 main.tsx 淡出移除。 */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #f7f3ea;
        font-family: "Kaiti SC", "KaiTi", "STKaiti", "SimSun", serif;
        transition: opacity 0.26s ease;
        user-select: none;
      }
      #boot-splash.boot-hide { opacity: 0; }
      #boot-splash svg { width: 88px; height: 88px; animation: boot-breathe 1.8s ease-in-out infinite; }
      .boot-name { font-size: 30px; font-weight: 600; letter-spacing: 14px; text-indent: 14px; color: #3d3325; }
      .boot-tagline { font-size: 12px; letter-spacing: 2px; color: #9b917d; }
      .boot-dots { display: flex; gap: 6px; margin-top: 4px; }
      .boot-dots i { width: 5px; height: 5px; border-radius: 50%; background: #d8b45e; animation: boot-blink 1.2s ease-in-out infinite; }
      .boot-dots i:nth-child(2) { animation-delay: 0.2s; }
      .boot-dots i:nth-child(3) { animation-delay: 0.4s; }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }
      @keyframes boot-blink {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash { background: #20242e; }
        .boot-name { color: #ecdfc8; }
        .boot-tagline { color: #8a91a0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
        <!-- 与 src-tauri/icons/app-icon.svg 完全同源：任务栏/exe 图标同款视觉 -->
        <defs>
          <linearGradient id="boot-tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FAFCFF"/>
            <stop offset="1" stop-color="#E3EEFB"/>
          </linearGradient>
        </defs>
        <rect x="56" y="56" width="912" height="912" rx="200" fill="url(#boot-tile)"/>
        <g transform="translate(512 512) scale(36.9) translate(-10 -10.35)" fill="none" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 17.4V6.9" stroke="#2F6FED"/>
          <path d="M10 15.3c-2.3.2-3.6-.8-4-2.9 2.3-.1 3.6.9 4 2.9Z" fill="#2F6FED" stroke="none"/>
          <ellipse cx="7.6" cy="12.1" rx="2.35" ry="1.2" transform="rotate(53 7.6 12.1)" fill="#F4B942" stroke="none"/>
          <ellipse cx="12.4" cy="12.1" rx="2.35" ry="1.2" transform="rotate(-53 12.4 12.1)" fill="#F4B942" stroke="none"/>
          <ellipse cx="7.9" cy="8.9" rx="2.1" ry="1.1" transform="rotate(53 7.9 8.9)" fill="#F4B942" stroke="none"/>
          <ellipse cx="12.1" cy="8.9" rx="2.1" ry="1.1" transform="rotate(-53 12.1 8.9)" fill="#F4B942" stroke="none"/>
          <ellipse cx="10" cy="5.2" rx="1.15" ry="1.9" fill="#F4B942" stroke="none"/>
        </g>
      </svg>
      <div class="boot-name">有秋</div>
      <div class="boot-tagline">若农服田力穑 · 乃亦有秋</div>
      <div class="boot-dots"><i></i><i></i><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
